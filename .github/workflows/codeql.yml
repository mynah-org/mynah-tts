name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp

      - name: Build
        run: make && make server

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev clang-tidy

      - name: Run clang-tidy
        run: |
          clang-tidy \
            -checks='clang-analyzer-core.*,clang-analyzer-unix.*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling,-clang-analyzer-deadcode.DeadStores,bugprone-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions,-bugprone-implicit-widening-of-multiplication-result,-bugprone-suspicious-realloc-usage,-bugprone-multi-level-implicit-pointer-conversion,-bugprone-misplaced-widening-cast,-bugprone-branch-clone,-bugprone-integer-division' \
            -warnings-as-errors='' \
            src/*.c cli/main.c server/*.c \
            -- -std=c11 -Isrc -Iserver -Ithird_party/ingot/include -D_DEFAULT_SOURCE -DMYNAH_USE_OPENBLAS -I/usr/include/openblas

  python:
    name: Python tooling
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Byte-compile the offline tools
        run: python -m compileall -q tools tests

      - name: Tooling smoke test
        run: python tests/test_python_tools.py

      # The ternary feasibility harness (E11) is closed-form solves transcribed
      # from papers: a transcription error would not crash and would not
      # obviously corrupt audio, it would quietly make one method look worse
      # than another. `make test` skips this when numpy is missing, so run it
      # HERE unconditionally -- this is the job that owns the Python tooling and
      # the one place the skip must not be able to reach.
      - name: Ternary feasibility self-test
        run: |
          python -m pip install --disable-pip-version-check numpy
          python tools/ternary_feasibility.py self-test
