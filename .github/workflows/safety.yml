name: Memory Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# BOTH SANITIZERS RUN ON BOTH ARCHITECTURES.
#
# They used to run on x86 only, which left the NEON, SDOT and SMMLA kernels --
# the ones production actually executes on Graviton and Axion -- never
# sanitized on Linux at all. The arm runner reports dotprod and i8mm ON, so
# the int8 paths under test there are the shipped ones and not a fallback.
jobs:
  ubsan:
    name: UBSan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      # make ubsan builds into its own directory and runs the test target, so
      # the kernels are actually exercised rather than only compiled.
      - name: Build and run with UBSan
        run: make ubsan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  asan:
    name: ASan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Build and run with ASan
        run: make asan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
